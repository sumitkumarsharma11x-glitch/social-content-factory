<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Social Content Factory</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0}.top{background:#111827;color:#fff;padding:18px 28px;font-weight:700}.wrap{max-width:1150px;margin:34px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 8px 30px #0000000a;margin-bottom:20px}h1{margin:0 0 8px;font-size:30px}h2{margin-top:0}.muted{color:#667085}.label{display:block;font-weight:650;margin:20px 0 8px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #cfd5df;border-radius:10px;background:#fff}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff;margin-top:18px}.primary:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:18px;padding:12px;border-radius:10px;background:#f1f5f9}.error{background:#fff1f2;color:#9f1239}.ok{background:#ecfdf3;color:#166534}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.col{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.col h2{font-size:16px;margin:0 0 10px}.piece{padding:10px 0;border-top:1px solid #eee}.piece:first-child{border-top:0}.num{font-size:12px;color:#667085}.history{display:grid;gap:8px}.batch{padding:12px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer}.batch:hover{background:#f8fafc}.batch small{color:#667085}.review-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#eef2f7}.tab.active{background:#111827;color:#fff}.review-piece{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:12px 0}.piece-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.approve{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.edit{background:#e5e7eb}.save{background:#111827;color:#fff}.cancel{background:#f3f4f6}.field{margin-top:12px}.field label{display:block;font-weight:650;margin-bottom:6px}.review-error{margin-top:10px;padding:9px;border-radius:8px;background:#fff1f2;color:#9f1239}.hidden{display:none}.back{background:#eef2f7}.empty{padding:18px;border:1px dashed #d1d5db;border-radius:10px;color:#667085}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{margin-top:20px}.card{padding:18px}}
  </style>
</head>
<body>
  <div class="top">Social Content Factory</div>
  <main class="wrap">
    <section class="card">
      <h1>Generate 30 content pieces</h1>
      <p class="muted">Create 10 Instagram Reels, 10 Facebook Posts and 10 YouTube Shorts from one topic or chapter.</p>
      <label class="label" for="topic">Topic / Chapter</label>
      <input id="topic" placeholder="e.g. Photosynthesis, Chapter 4" />
      <label class="label" for="provider">AI provider</label>
      <select id="provider">
        <option value="mock">Mock (free test)</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="ollama">Ollama</option>
      </select>
      <button id="generate" class="primary">Generate 30 pieces</button>
      <div id="status" class="status" hidden></div>
    </section>

    <section class="card">
      <h2>Latest batch</h2>
      <div id="result" class="muted">Nothing generated yet.</div>
    </section>

    <section class="card">
      <h2>Batch history</h2>
      <div id="history" class="history"><span class="muted">Loading…</span></div>
    </section>

    <section id="review" class="card hidden">
      <div class="review-head">
        <div><h2>Review & approval</h2><div id="reviewMeta" class="muted"></div></div>
        <button class="back" id="closeReview">Close review</button>
      </div>
      <div id="reviewStatus" class="status" hidden></div>
      <div id="tabs" class="tabs"></div>
      <div id="reviewPieces"></div>
    </section>
  </main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showStatus(text,kind=''){const el=$('status');el.hidden=false;el.className='status '+kind;el.textContent=text}
function renderBatch(data){
  const groups={instagram_reel:['🎬','Instagram Reels'],facebook_post:['📘','Facebook Posts'],youtube_short:['▶️','YouTube Shorts']};
  $('result').innerHTML=`<p><strong>Batch #${data.batchId}</strong> · ${data.pieces.length}/30 pieces saved.</p><div class="grid">${Object.entries(groups).map(([k,m])=>`<div class="col"><h2>${m[0]} ${m[1]}</h2>${data.pieces.filter(p=>p.platform===k).map(p=>`<div class="piece"><div class="num">#${p.piece_number}</div><strong>${esc(p.title)}</strong><div>${esc(p.body)}</div><div class="muted">${esc(p.cta)}</div></div>`).join('')}</div>`).join('')}</div><button class="primary" onclick="openReview(${data.batchId})">Review / Edit this batch</button>`;
}
async function loadHistory(){
  try{const r=await fetch('/api/batches');const d=await r.json();
    $('history').innerHTML=d.batches?.length?d.batches.map(b=>`<div class="batch" onclick="openReview(${b.id})"><strong>Batch #${b.id}</strong> · ${esc(b.status)} · ${b.totalPieces}/30 pieces · ${b.approvedPieces}/${b.totalPieces} approved<br><small>${esc(b.created_at)} · ${esc(b.provider)}</small></div>`).join(''):'<span class="muted">No batches yet.</span>';
  }catch(e){$('history').textContent='Could not load history.'}
}
$('generate').onclick=async()=>{
  const topic=$('topic').value.trim(),provider=$('provider').value;
  if(!topic){showStatus('Topic/Chapter is required.','error');return}
  $('generate').disabled=true;showStatus('Generating…');
  try{const r=await fetch('/api/batches/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,provider})});const d=await r.json();if(!d.ok){showStatus(d.message||'Generation failed.','error');return}showStatus(`Batch #${d.batchId} saved: ${d.pieces.length}/30 pieces.`,'ok');renderBatch(d);loadHistory();}
  catch(e){showStatus('Could not reach the server.','error')}finally{$('generate').disabled=false}
};

let currentBatch=null,currentTab='instagram_reel';
const tabs=[['instagram_reel','🎬 Instagram Reels'],['facebook_post','📘 Facebook Posts'],['youtube_short','▶️ YouTube Shorts']];
function reviewMessage(text,kind=''){const e=$('reviewStatus');e.hidden=false;e.className='status '+kind;e.textContent=text}
async function openReview(batchId){
  $('review').classList.remove('hidden');$('reviewPieces').innerHTML='<div class="empty">Loading batch…</div>';window.scrollTo({top:$('review').offsetTop-20,behavior:'smooth'});
  try{const r=await fetch(`/api/batches/${batchId}`);const d=await r.json();if(!d.ok){$('reviewPieces').innerHTML=`<div class="empty">${esc(d.message)}</div>`;return}currentBatch=d;currentTab='instagram_reel';$('reviewMeta').textContent=`Batch #${d.batch.id} · ${esc(d.batch.provider)} · ${esc(d.batch.model)} · ${esc(d.batch.status)}`;renderTabs();renderReviewPieces();}
  catch(e){$('reviewPieces').innerHTML='<div class="empty">Could not reach the server.</div>'}
}
function renderTabs(){ $('tabs').innerHTML=tabs.map(t=>`<button class="tab ${currentTab===t[0]?'active':''}" onclick="selectTab('${t[0]}')">${t[1]}</button>`).join('') }
function selectTab(t){currentTab=t;renderTabs();renderReviewPieces()}
function statusLabel(s){return {pending:'Pending review',edited:'Edited',approved:'Approved',rejected:'Rejected'}[s]||s}
function renderReviewPieces(){
  const list=currentBatch.pieces.filter(p=>p.platform===currentTab).sort((a,b)=>a.piece_number-b.piece_number);
  $('reviewPieces').innerHTML=list.length?list.map(renderPiece).join(''):'<div class="empty">No pieces found.</div>';
}
function renderPiece(p){
  return `<article class="review-piece" id="piece-${p.id}"><div class="piece-head"><strong>#${p.piece_number}</strong><span class="badge">${esc(statusLabel(p.status))}</span></div><div id="view-${p.id}"><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p><p class="muted">${esc(p.hashtags.join(' '))}</p><p><strong>CTA:</strong> ${esc(p.cta)}</p><div class="actions"><button class="edit" onclick="startEdit(${p.id})">Edit</button><button class="approve" onclick="transitionPiece(${p.id},'approved')" ${p.status==='approved'?'disabled':''}>Approve</button><button class="reject" onclick="transitionPiece(${p.id},'rejected')" ${p.status==='rejected'?'disabled':''}>Reject</button></div></div><div id="edit-${p.id}" class="hidden"></div><div id="err-${p.id}"></div></article>`;
}
function startEdit(id){
  const p=currentBatch.pieces.find(x=>x.id===id);if(!p)return;
  const e=$(`edit-${id}`);e.classList.remove('hidden');$('view-'+id).classList.add('hidden');
  e.innerHTML=`<div class="field"><label>Title</label><input id="title-${id}" value="${esc(p.title)}"></div><div class="field"><label>Body</label><textarea id="body-${id}">${esc(p.body)}</textarea></div><div class="field"><label>Hashtags (comma separated)</label><input id="hashtags-${id}" value="${esc(p.hashtags.join(', '))}"></div><div class="field"><label>CTA</label><input id="cta-${id}" value="${esc(p.cta)}"></div><div class="actions"><button class="save" onclick="saveEdit(${id})">Save changes</button><button class="cancel" onclick="cancelEdit(${id})">Cancel</button></div>`;
}
function cancelEdit(id){renderReviewPieces()}
async function saveEdit(id){
  const payload={title:$(`title-${id}`).value,body:$(`body-${id}`).value,hashtags:$(`hashtags-${id}`).value.split(',').map(x=>x.trim()).filter(Boolean),cta:$(`cta-${id}`).value};
  await pieceRequest(id,'PUT',payload);
}
async function transitionPiece(id,status){await pieceRequest(id,'POST',{status})}
async function pieceRequest(id,method,payload){
  const endpoint=method==='PUT'?`/api/pieces/${id}`:`/api/pieces/${id}/transition`;
  try{const r=await fetch(endpoint,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!d.ok){$(`err-${id}`).innerHTML=`<div class="review-error">${esc(d.message)}</div>`;return}currentBatch.pieces=currentBatch.pieces.map(p=>p.id===id?d.piece:p);reviewMessage(method==='PUT'?'Changes saved.':'Piece status updated.','ok');renderReviewPieces();loadHistory();}
  catch(e){$(`err-${id}`).innerHTML='<div class="review-error">Could not reach the server.</div>'}
}
$('closeReview').onclick=()=>{$('review').classList.add('hidden');$('reviewStatus').hidden=true};
loadHistory();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Social Content Factory</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0}.top{background:#111827;color:#fff;padding:18px 28px;font-weight:700}.wrap{max-width:1100px;margin:34px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px;box-shadow:0 8px 30px #0000000a;margin-bottom:20px}h1{margin:0 0 8px;font-size:30px}.muted{color:#667085}.label{display:block;font-weight:650;margin:20px 0 8px}input,select,button{font:inherit}input,select{width:100%;padding:13px 14px;border:1px solid #cfd5df;border-radius:10px;background:#fff}button{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#111827;color:#fff;margin-top:18px}.primary:disabled{opacity:.55;cursor:not-allowed}.status{margin-top:18px;padding:12px;border-radius:10px;background:#f1f5f9}.error{background:#fff1f2;color:#9f1239}.ok{background:#ecfdf3;color:#166534}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.col{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.col h2{font-size:16px;margin:0 0 10px}.piece{padding:10px 0;border-top:1px solid #eee}.piece:first-child{border-top:0}.num{font-size:12px;color:#667085}.history{display:grid;gap:8px}.batch{padding:12px;border:1px solid #e5e7eb;border-radius:10px;cursor:pointer}.batch:hover{background:#f8fafc}@media(max-width:750px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="top">Social Content Factory</div>
  <main class="wrap">
    <section class="card">
      <h1>Generate 30 content pieces</h1>
      <p class="muted">Create 10 Instagram Reels, 10 Facebook Posts and 10 YouTube Shorts from one topic or chapter.</p>
      <label class="label" for="topic">Topic / Chapter</label>
      <input id="topic" placeholder="e.g. Photosynthesis, Chapter 4" />
      <label class="label" for="provider">AI provider</label>
      <select id="provider">
        <option value="mock">Mock (free local test)</option>
        <option value="gemini">Gemini</option>
        <option value="claude">Claude</option>
        <option value="ollama">Ollama</option>
      </select>
      <button id="generate" class="primary">Generate 30 pieces</button>
      <div id="status" class="status" hidden></div>
    </section>

    <section class="card">
      <h2>Latest batch</h2>
      <div id="result" class="muted">Nothing generated yet.</div>
    </section>

    <section class="card">
      <h2>Batch history</h2>
      <div id="history" class="history"><span class="muted">Loading…</span></div>
    </section>
  </main>
<script>
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function showStatus(text,kind=''){const el=$('status');el.hidden=false;el.className='status '+kind;el.textContent=text}
function renderBatch(data){
  const groups={instagram_reel:['🎬','Instagram Reels'],facebook_post:['📘','Facebook Posts'],youtube_short:['▶️','YouTube Shorts']};
  $('result').innerHTML=`<p><strong>Batch #${data.batchId}</strong> · ${data.pieces.length}/30 pieces saved.</p><div class="grid">${Object.entries(groups).map(([k,m])=>`<div class="col"><h2>${m[0]} ${m[1]}</h2>${data.pieces.filter(p=>p.platform===k).map(p=>`<div class="piece"><div class="num">#${p.piece_number}</div><strong>${esc(p.title)}</strong><div>${esc(p.body)}</div><div class="muted">${esc(p.cta)}</div></div>`).join('')}</div>`).join('')}</div>`;
}
async function loadHistory(){try{const r=await fetch('/api/batches');const d=await r.json();$('history').innerHTML=d.batches.length?d.batches.map(b=>`<div class="batch"><strong>Batch #${b.id}</strong> · ${esc(b.status)} · ${b.piece_count}/30 pieces · ${esc(b.created_at)}</div>`).join(''):'<span class="muted">No batches yet.</span>'}catch(e){$('history').textContent='Could not load history.'}}
$('generate').onclick=async()=>{const topic=$('topic').value.trim(),provider=$('provider').value;if(!topic){showStatus('Topic/Chapter is required.','error');return} $('generate').disabled=true;showStatus('Generating…');try{const r=await fetch('/api/batches/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,provider})});const d=await r.json();if(!d.ok){showStatus(d.message||'Generation failed.','error');return}showStatus(`Batch #${d.batchId} saved: ${d.pieces.length}/30 pieces.`,'ok');renderBatch(d);loadHistory()}catch(e){showStatus('Could not reach the server.','error')}finally{$('generate').disabled=false}};
loadHistory();
</script>
</body></html>
